name: CI

on:
  push:
    branches: [main]
    tags: ['stackline-v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, types, coverage, audits, closure, and package quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.20.2
          cache: npm
      - run: npm install --global npm@10.8.2
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: mkdir artifact
      - run: npm pack --ignore-scripts --pack-destination artifact
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a7 # v7.0.1
        with:
          name: npm-package
          path: artifact/*.tgz
          if-no-files-found: error
          retention-days: 14

  runtime:
    name: Node.js ${{ matrix.node }} packed consumer
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [8.17.0, 10.24.1, 12.22.12, 14.21.3, 16.20.2, 18.20.8, 20.20.2, 22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: artifact
      - run: node scripts/ci-packed-consumer.cjs artifact

  legacy-runtime:
    name: Node.js 4 and 6 packed consumers
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['node:4.9.1', 'node:6.17.1']
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: artifact
      - name: Install and exercise the packed artifact
        run: >-
          docker run --rm -v "$PWD/artifact:/artifact:ro" ${{ matrix.image }} sh -c
          "mkdir /tmp/consumer && cd /tmp/consumer && npm init -y >/dev/null &&
          npm install --ignore-scripts /artifact/*.tgz &&
          node -e \"var d=require('@stackline/deep-copy');var x={a:{b:1}};x.self=x;var y=d(x);if(y===x||y.a===x.a||y.self!==y)process.exit(1)\""

  platform:
    name: ${{ matrix.os }} packed consumer
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.20.2
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:upstream
      - run: npm run test:differential
      - run: npm run test:browser
      - run: mkdir artifact
      - run: npm pack --ignore-scripts --pack-destination artifact
      - run: node scripts/ci-packed-consumer.cjs artifact

  source-integrity:
    name: Upstream source and MIT attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: grep -F 'Copyright (c) Simeon Velichkov' LICENSE
      - run: grep -F 'deep-copy@1.4.2' THIRD_PARTY_LICENSES.md
